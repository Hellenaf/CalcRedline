<!DOCTYPE html>

        Babel.registerPreset('react-classic', {
            presets: [
                [Babel.availablePresets['react'], { runtime: 'classic' }]
            ]
        });
    </script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Inter:wght@400;500;600;700;900&display=swap');
        
        body { font-family: 'Inter', sans-serif; }
        h1, h2, h3, .font-heading { font-family: 'Rajdhani', sans-serif; }

        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(82, 82, 91, 0.5); border-radius: 4px; }
        .dark ::-webkit-scrollbar-thumb { background: rgba(63, 63, 70, 0.5); }
        ::-webkit-scrollbar-thumb:hover { background: #ef4444; }
        
        .hide-scroll::-webkit-scrollbar { display: none; }
        .hide-scroll { -ms-overflow-style: none; scrollbar-width: none; }

        .glass { 
            @apply bg-white/70 dark:bg-zinc-950/70 backdrop-blur-xl border-b border-zinc-200 dark:border-white/5;
        }
        .glass-float { 
            @apply bg-white/80 dark:bg-zinc-900/80 backdrop-blur-xl border-t border-zinc-200 dark:border-white/10;
        }
        .glass-card { 
            @apply bg-white/60 dark:bg-zinc-800/40 backdrop-blur-md border border-white/40 dark:border-white/5 shadow-sm;
        }
        
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .animate-fade { animation: fadeIn 0.3s ease-out forwards; }

        @keyframes slideDown { from { transform: translate(-50%, -100%); opacity: 0; } to { transform: translate(-50%, 0); opacity: 1; } }
        .toast-enter { animation: slideDown 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; }
        
        @keyframes neonPulseLeft {
            0% { border-left-color: #ef4444; box-shadow: none; }
            20% { border-left-color: #00ffff; box-shadow: 0 0 15px rgba(0, 255, 255, 0.5); }
            40% { border-left-color: #ff00ff; box-shadow: 0 0 15px rgba(255, 0, 255, 0.5); }
            60% { border-left-color: #00ff00; box-shadow: 0 0 15px rgba(0, 255, 0, 0.5); }
            80% { border-left-color: #00ffff; box-shadow: 0 0 15px rgba(0, 255, 255, 0.5); }
            100% { border-left-color: #ef4444; box-shadow: none; }
        }
        @keyframes rainbowBorder {
            0% { box-shadow: inset 0 0 50px rgba(255, 0, 0, 0.5), inset 0 0 20px rgba(255, 0, 0, 0.3); }
            17% { box-shadow: inset 0 0 50px rgba(255, 127, 0, 0.5), inset 0 0 20px rgba(255, 127, 0, 0.3); }
            33% { box-shadow: inset 0 0 50px rgba(255, 255, 0, 0.5), inset 0 0 20px rgba(255, 255, 0, 0.3); }
            50% { box-shadow: inset 0 0 50px rgba(0, 255, 0, 0.5), inset 0 0 20px rgba(0, 255, 0, 0.3); }
            67% { box-shadow: inset 0 0 50px rgba(0, 0, 255, 0.5), inset 0 0 20px rgba(0, 0, 255, 0.3); }
            83% { box-shadow: inset 0 0 50px rgba(139, 0, 255, 0.5), inset 0 0 20px rgba(139, 0, 255, 0.3); }
            100% { box-shadow: inset 0 0 50px rgba(255, 0, 0, 0.5), inset 0 0 20px rgba(255, 0, 0, 0.3); }
        }
        .neon-pulse-active {
            animation: neonPulseLeft 2.5s ease-in-out;
        }
        .rainbow-border-active {
            animation: rainbowBorder 5s linear infinite;
        }

        @keyframes smokeRise {
            0% {
                transform: translateY(100%) scale(0.8) rotate(0deg);
                opacity: 0;
            }
            15% {
                opacity: 0.4;
            }
            100% {
                transform: translateY(-100vh) scale(3) rotate(180deg);
                opacity: 0;
                filter: blur(25px);
            }
        }
        .smoke-container {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            pointer-events: none;
            z-index: 9998;
            overflow: hidden;
        }
        .smoke-particle {
            position: absolute;
            bottom: -80px;
            width: 250px;
            height: 250px;
            background: radial-gradient(circle, rgba(220, 220, 220, 0.25) 0%, rgba(220, 220, 220, 0.1) 40%, rgba(220, 220, 220, 0) 70%);
            border-radius: 50%;
            filter: blur(15px);
            opacity: 0;
        }
        .smoke-p1 { left: 5%; animation: smokeRise 2.8s ease-out forwards; animation-delay: 0s; }
        .smoke-p2 { left: 20%; animation: smokeRise 2.5s ease-out forwards; animation-delay: 0.2s; }
        .smoke-p3 { left: 35%; animation: smokeRise 2.9s ease-out forwards; animation-delay: 0.1s; }
        .smoke-p4 { left: 50%; animation: smokeRise 2.6s ease-out forwards; animation-delay: 0.3s; }
        .smoke-p5 { left: 65%; animation: smokeRise 2.8s ease-out forwards; animation-delay: 0s; }
        .smoke-p6 { left: 80%; animation: smokeRise 2.4s ease-out forwards; animation-delay: 0.4s; }
        .smoke-p7 { left: 15%; animation: smokeRise 3s ease-out forwards; animation-delay: 0.15s; }
        .smoke-p8 { left: 55%; animation: smokeRise 2.7s ease-out forwards; animation-delay: 0.25s; }
        .smoke-p9 { left: 75%; animation: smokeRise 2.9s ease-out forwards; animation-delay: 0.05s; }
        .smoke-p10 { left: 90%; animation: smokeRise 2.6s ease-out forwards; animation-delay: 0.35s; }
    </style>

        const DEFAULT_DATA = {

                    { name: "BLINDAGEM", enableSelectAll: true, id: "blindagem-terrestres", items: [{ name: "RESISTÊNCIA", value: 6000000 }, { name: "PNEU BLINDADO", value: 200000 }] },
                    { name: "ESTÉTICA", enableSelectAll: true, id: "estetica", items: [{ name: "COR PRIMÁRIA", value: 25000 }, { name: "COR SECUNDÁRIA", value: 25000 }, { name: "COR CAMALEÃO", value: 35000 }, { name: "PEROLADO", value: 25000 }, { name: "XENOM", value: 25000 }, { name: "NEON", value: 25000 }, { name: "OUTRAS ESTÉTICAS", value: 25000, counter: true }] },

        const AnimatedPrice = ({ value }) => {
            const [displayValue, setDisplayValue] = useState(value);
            
            useEffect(() => {
                const start = displayValue;
                const end = value;
                if (start === end) return;
                
                if (end < start) {
                    setDisplayValue(end);
                    return;
                }
                
                const duration = 500; 
                const startTime = performance.now();
                let animationFrameId;
                
                const updateNumber = (now) => {
                    const elapsed = now - startTime;
                    const progress = Math.min(elapsed / duration, 1);
                    const easeProgress = progress * (2 - progress); 
                    const current = start + (end - start) * easeProgress;
                    setDisplayValue(current);
                    
                    if (progress < 1) {
                        animationFrameId = requestAnimationFrame(updateNumber);
                    } else {
                        setDisplayValue(end);
                    }
                };
                
                animationFrameId = requestAnimationFrame(updateNumber);
                return () => cancelAnimationFrame(animationFrameId);
            }, [value]);

            const fmt = v => Math.round(v).toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });

            return <span>{fmt(displayValue)}</span>;
        };

        const STORAGE_KEY = 'redline_calc_vehicle_data_v2';

        const ensureBlindagem = (d) => {
            if (!d || typeof d !== 'object') return d;
            const blindagemItems = [
                { name: "RESISTÊNCIA", value: 6000000 },
                { name: "PNEU BLINDADO", value: 200000 }
            ];
            ['terrestres', 'aereos', 'especiais'].forEach(catKey => {
                if (d[catKey] && Array.isArray(d[catKey].sections)) {
                    const hasBlindagem = d[catKey].sections.some(s => s && s.name && s.name.toUpperCase() === 'BLINDAGEM');
                    if (!hasBlindagem) {
                        d[catKey].sections.push({
                            name: "BLINDAGEM",
                            enableSelectAll: true,
                            id: `blindagem-${catKey}`,
                            items: JSON.parse(JSON.stringify(blindagemItems))
                        });
                    } else {
                        const bSec = d[catKey].sections.find(s => s && s.name && s.name.toUpperCase() === 'BLINDAGEM');
                        if (bSec && Array.isArray(bSec.items)) {
                            const hasResistencia = bSec.items.some(i => i.name.toUpperCase().includes('RESIST'));
                            if (!hasResistencia) bSec.items.unshift({ name: "RESISTÊNCIA", value: 6000000 });
                            const hasPneu = bSec.items.some(i => i.name.toUpperCase().includes('PNEU'));
                            if (!hasPneu) bSec.items.push({ name: "PNEU BLINDADO", value: 200000 });
                        }
                    }
                }
            });
            return d;
        };

        const loadInitialData = () => {
            if (typeof window !== 'undefined') {
                try {
                    const saved = localStorage.getItem(STORAGE_KEY);
                    if (saved) {
                        const parsed = JSON.parse(saved);
                        if (parsed && typeof parsed === 'object' && Object.keys(parsed).length > 0) {
                            return ensureBlindagem(parsed);
                        }
                    }
                } catch (e) {
                    console.error("Erro ao carregar dados do LocalStorage:", e);
                }
            }
            return ensureBlindagem(JSON.parse(JSON.stringify(DEFAULT_DATA)));
        };

        const App = () => {
            const [user, setUser] = useState(null);
            const [isAdmin, setIsAdmin] = useState(() => {
                if (typeof window !== 'undefined') {
                    const sessionAdmin = sessionStorage.getItem('redline_admin_session');
                    if (sessionAdmin === 'true') return true;
                    return window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1';
                }
                return false;
            });
            const [activeTab, setActiveTab] = useState('calculator');
            const [vehicleData, setVehicleData] = useState(loadInitialData);
            const [isOffline, setIsOffline] = useState(false);

            const updateVehicleData = (newData) => {
                setVehicleData(newData);
                try {
                    localStorage.setItem(STORAGE_KEY, JSON.stringify(newData));
                } catch(e) {
                    console.error("Erro ao salvar no LocalStorage:", e);
                }
            };

            const [isDarkMode, setIsDarkMode] = useState(() => {
                if (typeof window !== 'undefined') {
                    const saved = localStorage.getItem('theme');
                    return saved ? saved === 'dark' : true;
                }
                return true;
            });

            useEffect(() => {
                const root = document.documentElement;
                if (isDarkMode) {
                    root.classList.add('dark');
                    localStorage.setItem('theme', 'dark');
                } else {
                    root.classList.remove('dark');
                    localStorage.setItem('theme', 'light');
                }
            }, [isDarkMode]);

            useEffect(() => {
                if (!auth) { 
                    setIsOffline(true); 
                } else {
                    auth.signInAnonymously().catch(() => {});
                }

                const unsubAuth = auth ? auth.onAuthStateChanged(u => { 
                    setUser(u); 
                    if (u && !u.isAnonymous) {
                        setIsAdmin(true);
                        sessionStorage.setItem('redline_admin_session', 'true');
                    }
                }) : () => {};

                let unsubData = () => {};
                if (db) {
                    unsubData = db.collection('artifacts').doc('redline-calc').collection('public').doc('vehicle_prices')
                        .onSnapshot(doc => { 
                            if (doc.exists) { 
                                let d = doc.data().config;
                                if (d && typeof d === 'object' && Object.keys(d).length > 0) {
                                    const keys = Object.keys(d);
                                    keys.forEach((k, i) => {
                                        if (d[k].order === undefined) d[k].order = i;
                                        if (d[k].template === undefined) d[k].template = 'standard';
                                    });
                                    updateVehicleData(ensureBlindagem(d)); 
                                }
                            } 
                        }, (err) => {
                            console.warn("Aviso Firestore offline:", err);
                            setIsOffline(true);
                        });
                }
                return () => { unsubAuth(); unsubData(); }
            }, []);

            return (
                <div className="h-full w-full flex flex-col relative transition-colors duration-300">
                    {}
                    <div className="fixed top-0 left-0 w-full h-96 bg-red-600/10 rounded-full blur-[128px] -translate-y-1/2 pointer-events-none opacity-0 dark:opacity-100 transition-opacity duration-500 z-0"></div>
                    
                    {}
                    <header className="flex-none glass z-[100] relative">
                        <div className="max-w-7xl mx-auto px-4 py-3 flex justify-between items-center">
                            <div className="flex items-center gap-2 md:gap-3">
                                <img src="LOGO-REDLINE-2.png" alt="Logo Redline" className="w-10 h-10 md:w-16 md:h-16 object-contain" />
                                <div>
                                    <h1 className="font-heading font-bold text-base md:text-xl leading-none tracking-wide text-zinc-900 dark:text-white">REDLINE</h1>
                                    <span className="text-[10px] text-zinc-500 dark:text-zinc-400 uppercase tracking-widest font-bold">Calculadora</span>
                                </div>
                            </div>
                            <div className="flex items-center gap-2">
                                <button onClick={() => setIsDarkMode(!isDarkMode)} className="p-2 rounded-lg text-zinc-600 dark:text-zinc-400 hover:bg-zinc-200 dark:hover:bg-zinc-800 transition-colors">
                                    {isDarkMode ? <Icons.Sun size={18} /> : <Icons.Moon size={18} />}
                                </button>
                                <nav className="flex p-1 bg-zinc-200 dark:bg-zinc-900/50 rounded-lg border border-zinc-300 dark:border-white/5">
                                    <button onClick={() => setActiveTab('calculator')} className={`px-3 md:px-4 py-1.5 rounded-md text-xs font-bold uppercase transition-all flex items-center gap-2 ${activeTab === 'calculator' ? 'bg-white dark:bg-zinc-800 text-zinc-900 dark:text-white shadow-sm' : 'text-zinc-500 hover:text-zinc-800 dark:hover:text-zinc-300'}`}>
                                        <Icons.Calculator size={14} /> <span className="hidden sm:inline">Calc</span>
                                    </button>
                                    <button onClick={() => setActiveTab('admin')} className={`px-3 md:px-4 py-1.5 rounded-md text-xs font-bold uppercase transition-all flex items-center gap-2 ${activeTab === 'admin' ? 'bg-white dark:bg-zinc-800 text-zinc-900 dark:text-white shadow-sm' : 'text-zinc-500 hover:text-zinc-800 dark:hover:text-zinc-300'}`}>
                                        <Icons.Settings size={14} /> <span className="hidden sm:inline">Admin</span>
                                    </button>
                                </nav>
                            </div>
                        </div>
                    </header>

                    {}
                    <main className="flex-1 w-full relative flex flex-col overflow-hidden z-10">
                        {vehicleData ? (
                            activeTab === 'calculator' ? 
                                <CalculatorView data={vehicleData} /> : 
                                <AdminPanel 
                                    user={user} 
                                    isAdmin={isAdmin} 
                                    setIsAdmin={setIsAdmin}
                                    currentData={vehicleData} 
                                    onUpdateData={updateVehicleData}
                                    isDarkMode={isDarkMode} 
                                />
                        ) : (
                            <div className="flex flex-col items-center justify-center h-[50vh] text-zinc-500 gap-4">
                                <Icons.Spinner size={32}/>
                                <p className="text-xs uppercase tracking-widest font-bold">Carregando Sistema...</p>
                            </div>
                        )}
                    </main>
                </div>
            );
        };

        const CalculatorView = ({ data }) => {
            const sortedKeys = useMemo(() => {
                return Object.keys(data).sort((a, b) => (data[a].order ?? 0) - (data[b].order ?? 0));
            }, [data]);

            const [selectedType, setSelectedType] = useState(() => sortedKeys[0]);
            const [machineValue, setMachineValue] = useState('');
            const [selectedItems, setSelectedItems] = useState({});
            const [counters, setCounters] = useState({});
            const [copied, setCopied] = useState(null);
            const [toast, setToast] = useState({ show: false, message: '' });

            const [kitsQty, setKitsQty] = useState('');

            const [pulseNeon, setPulseNeon] = useState(false);

            const isNeonSelected = useMemo(() => {
                if (selectedType !== 'terrestres') return false;
                const currentCat = data[selectedType];
                if (!currentCat || !currentCat.sections) return false;

                for (let sIdx = 0; sIdx < currentCat.sections.length; sIdx++) {
                    const sec = currentCat.sections[sIdx];
                    for (let iIdx = 0; iIdx < sec.items.length; iIdx++) {
                        const item = sec.items[iIdx];
                        if (item.name.toUpperCase() === 'NEON') {
                            const key = `${selectedType}-${sIdx}-${iIdx}`;
                            return !!selectedItems[key];
                        }
                    }
                }
                return false;
            }, [selectedItems, selectedType, data]);

            useEffect(() => {
                if (isNeonSelected) {
                    setPulseNeon(true);
                    const timer = setTimeout(() => setPulseNeon(false), 2500);
                    return () => clearTimeout(timer);
                }
            }, [isNeonSelected]);

            const fullTuningStats = useMemo(() => {
                const currentCat = data[selectedType];
                if (!currentCat || !currentCat.sections) return { selected: 0, total: 0 };

                const ftSectionIdx = currentCat.sections.findIndex(s => s.name.toUpperCase() === 'FULL TUNING');
                if (ftSectionIdx === -1) return { selected: 0, total: 0 };
                
                const ftSection = currentCat.sections[ftSectionIdx];
                const total = ftSection.items.length;
                let selected = 0;
                ftSection.items.forEach((_, iIdx) => {
                    const key = `${selectedType}-${ftSectionIdx}-${iIdx}`;
                    if (selectedItems[key]) {
                        selected++;
                    }
                });
                return { selected, total };
            }, [selectedItems, selectedType, data]);

            const isChameleonSelected = useMemo(() => {
                const keys = Object.keys(selectedItems).filter(k => selectedItems[k]);
                for (const key of keys) {
                    try {
                        const [type, sIdx, iIdx] = key.split('-');
                        const item = data[type]?.sections?.[sIdx]?.items?.[iIdx];
                        if (item && item.name) {
                            const nameUpper = item.name.toUpperCase();
                            if (nameUpper.includes('CAMALE')) {
                                return true;
                            }
                        }
                    } catch (e) {}
                }
                return false;
            }, [selectedItems, data]);

            const [showSmoke, setShowSmoke] = useState(false);

            const isSmokeSelected = useMemo(() => {
                const keys = Object.keys(selectedItems).filter(k => selectedItems[k]);
                for (const key of keys) {
                    try {
                        const [type, sIdx, iIdx] = key.split('-');
                        const item = data[type].sections[sIdx].items[iIdx];
                        if (item && (item.name.toUpperCase().includes('COR DA FUMAÇ') || item.name.toUpperCase().includes('COR DA FUMAC'))) {
                            return true;
                        }
                    } catch (e) {}
                }
                return false;
            }, [selectedItems, data]);

            useEffect(() => {
                if (isSmokeSelected) {
                    setShowSmoke(true);
                    const timer = setTimeout(() => setShowSmoke(false), 3000);
                    return () => clearTimeout(timer);
                }
            }, [isSmokeSelected]);

            useEffect(() => {
                if (!data[selectedType]) setSelectedType(sortedKeys[0]);
            }, [data, sortedKeys]);

            useEffect(() => { 
                setSelectedItems({}); 
                setCounters({}); 
                setMachineValue(''); 
                setKitsQty('');
            }, [selectedType]);

            const current = data[selectedType] || { sections: [] };
            const isKitsMode = current.template === 'kits';
            const partnershipDiscount = current.discountValue || 0;
            const isPartnershipAllowed = current.partnershipEnabled !== false;

            const totals = useMemo(() => {
                if (isKitsMode) {
                    const qty = parseInt(kitsQty) || 0;
                    const kVal = current.kitValue || 8000;
                    const tVal = current.taxValue || 4000;
                    return { normal: qty * kVal, tax: qty * tVal };
                }

                let r = parseFloat(machineValue.replace(/[^0-9,]/g,'').replace(',','.'))||0;
                let n = r, p = r;
                Object.keys(selectedItems).forEach(k => {
                    if(selectedItems[k]) {
                        try {
                            const [type, sIdx, iIdx] = k.split('-');
                            const item = data[type].sections[sIdx].items[iIdx];
                            const c = item.counter ? (counters[k]||0) : 1;
                            n += item.value * c;
                            p += Math.max(0, item.value - partnershipDiscount) * c;
                        } catch(e) {}
                    }
                });
                return { normal: n, part: p };
            }, [selectedItems, counters, machineValue, data, partnershipDiscount, isKitsMode, kitsQty, current.kitValue, current.taxValue]);

            const copy = (val, type) => {
                const text = `cobrar ${Math.round(val)}`;
                const textArea = document.createElement("textarea");
                textArea.value = text;
                textArea.style.position = 'fixed';
                textArea.style.left = '-9999px';
                textArea.style.top = '0';
                document.body.appendChild(textArea);
                textArea.focus();
                textArea.select();
                try {
                    const success = document.execCommand('copy');
                    if(success) {
                        setCopied(type);
                        setToast({ show: true, message: `Valor ${type === 'normal' ? 'Total' : type === 'tax' ? 'Imposto' : 'Parceria'} copiado!` });
                    }
                } catch (err) {}
                document.body.removeChild(textArea);
                setTimeout(() => { setCopied(null); setToast({ show: false, message: '' }); }, 3000);
            };
            
            const fmt = v => v.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });

            return (
                <div className="flex flex-col h-full w-full">
                    {}
                    <div className={`fixed inset-0 pointer-events-none z-[9999] transition-all duration-1000 ${isChameleonSelected ? 'rainbow-border-active' : ''}`} />
                    {}
                    {showSmoke && (
                        <div className="smoke-container">
                            <div className="smoke-particle smoke-p1"></div>
                            <div className="smoke-particle smoke-p2"></div>
                            <div className="smoke-particle smoke-p3"></div>
                            <div className="smoke-particle smoke-p4"></div>
                            <div className="smoke-particle smoke-p5"></div>
                            <div className="smoke-particle smoke-p6"></div>
                            <div className="smoke-particle smoke-p7"></div>
                            <div className="smoke-particle smoke-p8"></div>
                            <div className="smoke-particle smoke-p9"></div>
                            <div className="smoke-particle smoke-p10"></div>
                        </div>
                    )}
                    {}
                    {toast.show && (
                        <div className="fixed top-28 left-1/2 -translate-x-1/2 z-[100] toast-enter w-max max-w-[90%]">
                            <div className="bg-zinc-900 text-white px-6 py-3 rounded-xl shadow-2xl border border-white/10 flex items-center gap-3 backdrop-blur-md">
                                <div className="bg-green-500 rounded-full p-1"><Icons.Check size={14} className="text-white"/></div>
                                <span className="font-bold text-xs md:text-sm tracking-wide">{toast.message}</span>
                            </div>
                        </div>
                    )}

                    {}
                    <div className="flex-none px-4 py-3 border-b border-zinc-200 dark:border-white/5 glass z-20 shadow-sm">
                        <div className="max-w-7xl mx-auto w-full">
                            <div className="flex overflow-x-auto hide-scroll gap-6 md:gap-8 items-center">
                                {sortedKeys.map(k => (
                                    <button key={k} onClick={() => setSelectedType(k)} 
                                        className={`flex-none pb-1 text-sm md:text-base lg:text-lg font-heading font-bold uppercase transition-all tracking-wide border-b-2
                                        ${selectedType === k 
                                            ? 'border-red-600 text-red-600' 
                                            : 'border-transparent text-zinc-500 hover:text-zinc-800 dark:hover:text-zinc-300'}`}>
                                        {data[k].title}
                                    </button>
                                ))}
                            </div>
                        </div>
                    </div>

                    {}
                    <div className="flex-1 overflow-y-auto w-full relative p-4 scroll-smooth pb-36 lg:pb-4 flex flex-col">
                        <div className="max-w-7xl mx-auto w-full flex-grow mb-12">
                            {isKitsMode ? (
                                
                                <div className="flex flex-col items-center justify-center min-h-[50vh] animate-fade">
                                    <div className="glass-card p-4 md:p-8 rounded-3xl w-full max-w-lg text-center border-t border-white/20 mx-auto">
                                        <div className="w-20 h-20 bg-red-600/10 rounded-2xl flex items-center justify-center mx-auto mb-6 text-red-500 shadow-xl shadow-red-900/10">
                                            <Icons.Package size={32}/>
                                        </div>
                                        <h2 className="text-2xl font-heading font-bold text-zinc-900 dark:text-white mb-2">Calculadora de Kits</h2>
                                        <p className="text-zinc-500 text-sm mb-8">Insira a quantidade de kits vendidos.</p>
                                        
                                        <div className="space-y-6">
                                            <div className="relative">
                                                <input type="number" value={kitsQty} onChange={e => setKitsQty(e.target.value)} 
                                                    className="w-full bg-zinc-100 dark:bg-black/30 border border-zinc-300 dark:border-zinc-700 p-5 rounded-2xl text-xl md:text-3xl text-center font-bold text-zinc-900 dark:text-white outline-none focus:border-red-600 transition-colors" 
                                                    placeholder="0" />
                                                <span className="absolute right-6 top-1/2 -translate-y-1/2 text-xs font-bold uppercase text-zinc-400">UN</span>
                                            </div>

                                            <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                                                <div className="bg-zinc-50 dark:bg-zinc-900/50 p-4 rounded-xl border border-zinc-200 dark:border-white/5">
                                                    <span className="text-[10px] font-bold uppercase text-zinc-500 block mb-1">Total ({fmt(current.kitValue || 8000)}/un)</span>
                                                    <div className="text-lg md:text-xl font-mono font-bold text-zinc-900 dark:text-white break-words">{fmt(totals.normal)}</div>
                                                    <button onClick={()=>copy(totals.normal, 'normal')} className="mt-2 w-full text-[10px] font-bold uppercase text-red-500 hover:bg-red-500/10 py-1 rounded">Copiar</button>
                                                </div>
                                                <div className="bg-zinc-50 dark:bg-zinc-900/50 p-4 rounded-xl border border-zinc-200 dark:border-white/5">
                                                    <span className="text-[10px] font-bold uppercase text-zinc-500 block mb-1">Imposto ({fmt(current.taxValue || 4000)}/un)</span>
                                                    <div className="text-lg md:text-xl font-mono font-bold text-zinc-900 dark:text-white break-words">{fmt(totals.tax)}</div>
                                                    <button onClick={()=>copy(totals.tax, 'tax')} className="mt-2 w-full text-[10px] font-bold uppercase text-blue-500 hover:bg-blue-500/10 py-1 rounded">Copiar</button>
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            ) : (
                                
                                <div className="grid grid-cols-1 lg:grid-cols-12 gap-8">
                                    {}
                                    <div className="lg:col-span-8 space-y-4">
                                        {current.sections.map((sec, sIdx) => (
                                            <div key={sIdx} className="glass-card rounded-2xl overflow-hidden animate-fade" style={{animationDelay: `${sIdx * 0.1}s`}}>
                                                <div className="px-3 py-2 md:px-4 md:py-3 flex justify-between items-center border-b border-zinc-200 dark:border-white/5 bg-zinc-50/50 dark:bg-white/5">
                                                    <h3 className="font-heading font-bold text-xs md:text-lg text-zinc-800 dark:text-white">{sec.name}</h3>
                                                    {sec.enableSelectAll !== false && (
                                                        <button onClick={() => {
                                                            const kBase = `${selectedType}-${sIdx}-`;
                                                            const all = sec.items.every((_, i) => selectedItems[`${kBase}${i}`]);
                                                            const n = {...selectedItems};
                                                            sec.items.forEach((item, i) => {
                                                                if(!item.counter) n[`${kBase}${i}`] = !all;
                                                            });
                                                            setSelectedItems(n);
                                                        }} className="text-[10px] md:text-xs font-bold uppercase tracking-wider text-zinc-500 hover:text-zinc-900 dark:text-zinc-400 dark:hover:text-white transition-colors bg-zinc-200 dark:bg-zinc-900/50 px-2 md:px-3 py-1 rounded border border-zinc-300 dark:border-white/5">
                                                            {sec.items.filter(i=>!i.counter).every((_, i) => selectedItems[`${selectedType}-${sIdx}-${i}`]) ? 'Desmarcar' : 'Todos'}
                                                        </button>
                                                    )}
                                                </div>
                                                <div className="divide-y divide-zinc-200 dark:divide-white/5">
                                                    {sec.items.map((item, iIdx) => {
                                                        const k = `${selectedType}-${sIdx}-${iIdx}`;
                                                        const isSel = !!selectedItems[k];
                                                        return (
                                                            <div key={iIdx} onClick={() => !item.counter && setSelectedItems(p=>({...p, [k]: !p[k]}))} 
                                                                className={`p-3 md:p-3 flex items-center justify-between cursor-pointer transition-all active:scale-[0.99]
                                                                ${isSel ? 'bg-red-500/10 border-l-4 border-l-red-500' : 'hover:bg-zinc-100 dark:hover:bg-white/5 border-l-4 border-l-transparent'}`}>
                                                                <div className="flex items-center gap-3 md:gap-4">
                                                                    <div className={`w-3.5 h-3.5 md:w-4 md:h-4 rounded border flex items-center justify-center transition-all ${isSel ? 'bg-red-600 border-red-500 text-white' : 'border-zinc-300 dark:border-zinc-700 bg-zinc-100 dark:bg-zinc-800/50 text-transparent'}`}>
                                                                        <Icons.Check size={10} strokeWidth={4} />
                                                                    </div>
                                                                    <span className={`text-xs md:text-sm font-bold ${isSel ? 'text-zinc-900 dark:text-white' : 'text-zinc-500 dark:text-zinc-400'}`}>{item.name}</span>
                                                                </div>
                                                                <div className="flex items-center gap-2 md:gap-4" onClick={e=>e.stopPropagation()}>
                                                                    <span className={`text-sm md:text-base font-mono font-bold whitespace-nowrap ${isSel ? 'text-red-600 dark:text-red-400' : 'text-zinc-600'}`}>{fmt(item.value)}</span>
                                                                    {item.counter && (
                                                                        <div className="flex items-center bg-zinc-200 dark:bg-zinc-950 rounded-lg p-0.5 md:p-1 border border-zinc-300 dark:border-zinc-800">
                                                                            <button onClick={() => { const v = Math.max(0, (counters[k]||0)-1); setCounters(p=>({...p, [k]: v})); setSelectedItems(p=>({...p, [k]: v>0})); }} className="p-1 md:p-2 text-zinc-500 hover:text-zinc-900 dark:hover:text-white"><Icons.Minus size={10}/></button>
                                                                            <span className="w-5 md:w-8 text-center text-[10px] md:text-xs font-bold text-zinc-800 dark:text-white">{counters[k] || 0}</span>
                                                                            <button onClick={() => { const v = (counters[k]||0)+1; setCounters(p=>({...p, [k]: v})); setSelectedItems(p=>({...p, [k]: true})); }} className="p-1 md:p-2 text-zinc-500 hover:text-zinc-900 dark:hover:text-white"><Icons.Plus size={10}/></button>
                                                                        </div>
                                                                    )}
                                                                </div>
                                                            </div>
                                                        );
                                                    })}
                                                </div>
                                            </div>
                                        ))}
                                    </div>

                                    {}
                                    <div className="hidden lg:block lg:col-span-4 h-full">
                                        <div className="space-y-4 sticky top-4">
                                            <div className="glass-card p-4 rounded-2xl">
                                                <label className="text-[10px] font-bold uppercase text-zinc-500 mb-2 block tracking-widest">Valor da Máquina</label>
                                                <input type="text" value={machineValue} 
                                                    onChange={e=>{ let v = e.target.value.replace(/\D/g, ''); if(!v) return setMachineValue(''); setMachineValue((parseInt(v)/100).toLocaleString('pt-BR', { minimumFractionDigits: 2 })); }} 
                                                    className="w-full bg-white dark:bg-zinc-950/50 border border-zinc-300 dark:border-zinc-700 rounded-xl px-4 py-3 text-2xl font-mono font-bold text-zinc-900 dark:text-white focus:border-red-600 outline-none transition-colors text-right placeholder-zinc-400 dark:placeholder-zinc-700" 
                                                    placeholder="0,00" />
                                            </div>

                                            <div className={`glass-card p-4 rounded-2xl border-l-4 border-l-red-600 bg-white dark:bg-gradient-to-br dark:from-zinc-900 dark:to-zinc-900 transition-all ${pulseNeon ? 'neon-pulse-active' : ''}`}>
                                                <div className="flex justify-between items-start">
                                                    <div>
                                                        <span className="text-[10px] font-bold uppercase text-zinc-500 tracking-widest">Total Cliente</span>
                                                        <div className="text-2xl lg:text-4xl font-heading font-bold text-zinc-900 dark:text-white mt-1 mb-3 break-words">
                                                            <AnimatedPrice value={totals.normal} />
                                                        </div>
                                                    </div>
                                                    {fullTuningStats.total > 0 && (
                                                        <div className="flex flex-col items-center" title="Conta-giros de Tunagem (Full Tuning)">
                                                            <svg width="60" height="40" viewBox="0 0 60 40" className="inline-block">
                                                                <path d="M 10 35 A 20 20 0 0 1 50 35" fill="none" stroke="#e4e4e7" strokeWidth="4" strokeLinecap="round" className="dark:stroke-zinc-800" />
                                                                <path d="M 10 35 A 20 20 0 0 1 30 15" fill="none" stroke="#22c55e" strokeWidth="4" />
                                                                <path d="M 30 15 A 20 20 0 0 1 45 21" fill="none" stroke="#eab308" strokeWidth="4" />
                                                                <path d="M 45 21 A 20 20 0 0 1 50 35" fill="none" stroke="#ef4444" strokeWidth="4" />
                                                                <g transform="translate(30, 35)">
                                                                    <line x1="0" y1="0" x2="0" y2="-18" stroke={fullTuningStats.selected === fullTuningStats.total ? "#ff0000" : "#ef4444"} strokeWidth="2" strokeLinecap="round"
                                                                          transform={`rotate(${-90 + (fullTuningStats.selected / fullTuningStats.total) * 180})`}
                                                                          style={{ transition: 'transform 0.5s cubic-bezier(0.34, 1.56, 0.64, 1)' }}
                                                                          className={fullTuningStats.selected === fullTuningStats.total ? "animate-pulse" : ""} />
                                                                    <circle cx="0" cy="0" r="3" fill="#18181b" className="dark:fill-white" />
                                                                </g>
                                                                <text x="30" y="32" textAnchor="middle" fontSize="6" className="fill-zinc-400 font-bold font-mono uppercase">
                                                                    {fullTuningStats.selected}/{fullTuningStats.total} FT

                                        </div>
                                    </div>

                                    {current.template !== 'kits' && (
                                        <div className="space-y-4">
                                            {current.sections.map((sec, sIdx) => (
                                                <div key={sIdx} className="glass-card rounded-2xl overflow-hidden border border-zinc-200 dark:border-white/5 shadow-sm group/section">
                                                    <div className="bg-zinc-50 dark:bg-zinc-900/40 p-4 border-b border-zinc-200 dark:border-white/5 flex flex-wrap items-center gap-4">
                                                        <div className="p-2 bg-zinc-200 dark:bg-zinc-800 rounded-lg text-zinc-500"><Icons.Check size={16}/></div>
                                                        <div className="flex-grow min-w-[200px]">
                                                            <label className="text-[9px] uppercase font-bold text-zinc-400 block mb-0.5">Nome da Seção</label>
                                                            <input type="text" value={sec.name} onChange={e=>{const n={...data}; n[activeCategory].sections[sIdx].name=e.target.value.toUpperCase(); setData(n);}} className="bg-transparent text-sm font-bold text-zinc-900 dark:text-white uppercase outline-none w-full placeholder-zinc-500" placeholder="EX: MOTOR" />
                                                        </div>
                                                        <label className="flex items-center gap-2 cursor-pointer bg-zinc-100 dark:bg-black/20 px-3 py-1.5 rounded-lg border border-zinc-200 dark:border-white/5">
                                                            <input type="checkbox" checked={sec.enableSelectAll !== false} onChange={e=>{const n={...data}; n[activeCategory].sections[sIdx].enableSelectAll=e.target.checked; setData(n);}} className="accent-red-600 w-4 h-4" />
                                                            <span className="text-[10px] font-bold text-zinc-500 uppercase">Select All</span>
                                                        </label>
                                                        <div className="flex items-center gap-1 bg-zinc-100 dark:bg-black/20 p-1 rounded-lg border border-zinc-200 dark:border-white/5">
                                                            <button type="button" onClick={()=>moveSection(sIdx, -1)} disabled={sIdx===0} className="p-1 text-zinc-400 hover:text-red-500 disabled:opacity-30 transition-colors" title="Mover para Cima">
                                                                <Icons.ArrowUp size={14}/>
                                                            </button>
                                                            <button type="button" onClick={()=>moveSection(sIdx, 1)} disabled={sIdx===current.sections.length-1} className="p-1 text-zinc-400 hover:text-red-500 disabled:opacity-30 transition-colors" title="Mover para Baixo">
                                                                <Icons.ArrowDown size={14}/>
                                                            </button>
                                                        </div>
                                                        <button onClick={()=>{const n={...data}; n[activeCategory].sections.splice(sIdx,1); setData(n);}} className="p-2 text-zinc-400 hover:text-red-500 hover:bg-red-500/10 rounded-lg transition-colors"><Icons.Trash size={18}/></button>
                                                    </div>
                                                    <div className="p-2">
                                                        <div className="space-y-1">
                                                            {sec.items.map((item, iIdx) => (
                                                                <div key={iIdx} className="group flex items-center gap-3 p-2 rounded-xl hover:bg-zinc-100 dark:hover:bg-zinc-800/40 border border-transparent hover:border-zinc-200 dark:hover:border-white/5 transition-all">
                                                                    <div className="flex-grow flex flex-col">
                                                                        <input type="text" value={item.name} onChange={e=>{const n={...data}; n[activeCategory].sections[sIdx].items[iIdx].name=e.target.value; setData(n);}} className="bg-transparent text-sm font-bold text-zinc-700 dark:text-zinc-300 w-full outline-none placeholder-zinc-500" placeholder="Nome do Item" />
                                                                    </div>
                                                                    <div className="relative">
                                                                        <input type="text" value={(item.value).toLocaleString('pt-BR')} 
                                                                            onChange={e=>{
                                                                                const val = parseInt(e.target.value.replace(/\D/g, '')) || 0;
                                                                                const n={...data}; n[activeCategory].sections[sIdx].items[iIdx].value=val; setData(n);
                                                                            }} 
                                                                            className="bg-white dark:bg-zinc-950 w-32 pl-2 pr-2 py-2 text-right text-sm font-mono font-bold text-zinc-800 dark:text-white rounded-lg border border-zinc-200 dark:border-zinc-800 outline-none focus:border-zinc-400 dark:focus:border-zinc-600 transition-colors shadow-sm" placeholder="0" />
                                                                    </div>
                                                                     <label className="flex items-center gap-1 cursor-pointer bg-zinc-200 dark:bg-zinc-800 px-2 py-2 rounded-lg" title="Ativar Contador">
                                                                        <input type="checkbox" checked={!!item.counter} onChange={e=>{const n={...data}; n[activeCategory].sections[sIdx].items[iIdx].counter=e.target.checked; setData(n);}} className="accent-red-600 w-3 h-3" />
                                                                        <span className="text-[9px] font-bold text-zinc-500 uppercase">Qtd?</span>
                                                                    </label>
                                                                    <div className="flex items-center gap-0.5 bg-zinc-200 dark:bg-zinc-800 rounded-lg p-1 border border-zinc-300 dark:border-zinc-700">
                                                                        <button type="button" onClick={()=>moveItem(sIdx, iIdx, -1)} disabled={iIdx===0} className="p-1 text-zinc-400 hover:text-red-500 disabled:opacity-30 transition-colors" title="Mover Item para Cima">
                                                                            <Icons.ArrowUp size={12}/>
                                                                        </button>
                                                                        <button type="button" onClick={()=>moveItem(sIdx, iIdx, 1)} disabled={iIdx===sec.items.length-1} className="p-1 text-zinc-400 hover:text-red-500 disabled:opacity-30 transition-colors" title="Mover Item para Baixo">
                                                                            <Icons.ArrowDown size={12}/>
                                                                        </button>
                                                                    </div>
                                                                    <button onClick={()=>{const n={...data}; n[activeCategory].sections[sIdx].items.splice(iIdx,1); setData(n);}} className="p-2 text-zinc-400 hover:text-red-500 transition-colors"><Icons.Trash size={16}/></button>
                                                                </div>
                                                            ))}
                                                        </div>
                                                        <button onClick={()=>{const n={...data}; n[activeCategory].sections[sIdx].items.push({name:'NOVO ITEM', value:0}); setData(n);}} className="mt-2 w-full py-3 text-[10px] font-bold uppercase text-zinc-500 hover:text-zinc-900 dark:hover:text-white bg-zinc-50 dark:bg-zinc-900/30 rounded-lg border border-dashed border-zinc-300 dark:border-zinc-800 hover:border-zinc-400 dark:hover:border-zinc-600 transition-all">+ Adicionar Item</button>
                                                    </div>
                                                </div>
                                            ))}
                                            <button onClick={()=>{const n={...data}; n[activeCategory].sections.push({name:'NOVA SEÇÃO', items:[]}); setData(n);}} className="w-full py-6 rounded-2xl border-2 border-dashed border-zinc-300 dark:border-zinc-800 text-zinc-400 hover:text-red-500 hover:border-red-500/50 hover:bg-red-500/5 transition-all flex flex-col items-center justify-center gap-2 group">
                                                <div className="p-2 bg-zinc-200 dark:bg-zinc-800 rounded-full group-hover:bg-red-500 group-hover:text-white transition-colors">
                                                    <Icons.Plus size={20}/>
                                                </div>
                                                <span className="text-xs font-bold uppercase tracking-widest">Criar Nova Seção</span>
                                            </button>
                                        </div>
                                    )}
                                </div>
                            )}
                        </div>
                        
                        <div className="w-full text-center py-8 text-xs text-zinc-500 dark:text-zinc-600 uppercase tracking-widest border-t border-zinc-200 dark:border-white/5 mt-auto">
                            &copy; 2025 Redline
                        </div>
                    </div>
                </div>
            );
        };

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
